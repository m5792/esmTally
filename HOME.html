<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desktop Dashboard (800px Layout)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            display: flex;
            justify-content: flex-end; /* Right side alignment */
            align-items: flex-start;  /* Top alignment */
            padding-right: 20px;
            color: #ffffff;
        }

        /* ================= MAIN RIGHT CONTAINER (800px Width & Top Gap) ================= */
        .right-container {
            display: flex;
            flex-direction: row; /* Horizontal layout: 500px + 200px */
            gap: 15px;
            width: 700px; 
            margin-top: 10px;
            max-height: calc(100vh - 70px);
            align-items: flex-start;
        }

        /* ================= 1st SUB-DIV (500px) - NOTICE BOARD ================= */
        .notice-board-section {
            width: 500px;
            max-height: calc(100vh - 70px);
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .notice-header {
            background: rgba(0, 0, 0, 0.35);
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.15);
        }

        .notice-header h2 {
            font-size: 1rem;
            font-weight: 600;
            color: #ffd700;
            text-transform: uppercase;
            text-align: center;
            letter-spacing: 0.5px;
        }

        .notice-body {
            flex: 1;
            padding: 12px;
            overflow-y: auto;
        }

        /* Scrollbar Styling */
        .notice-body::-webkit-scrollbar {
            width: 5px;
        }
        .notice-body::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 10px;
        }

        /* Pending List Styling */
        #pendingList {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        #pendingList li {
            background: rgba(255, 255, 255, 0.12);
            color: #ffffff !important;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            line-height: 1.4;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            border-left: 4px solid #ff4d4d;
            word-break: break-word;
            border: 1px solid rgba(255,255,255,0.08);
        }

        /* ================= 2nd SUB-DIV (200px) - CLOCK & BUTTONS ================= */
        .widget-section {
            width: 200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Clock Widget */
        .clock-widget {
            text-align: center;
            user-select: none;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 14px 10px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.2);
        }

        .clock-widget h1 {
            font-size: 2.2rem;
            font-weight: 350;
            line-height: 1;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .clock-widget p {
            font-size: 0.82rem;
            color: rgba(255, 255, 255, 0.85);
            margin-top: 6px;
            font-weight: 500;
        }

        /* Buttons Section */
        .buttons-sidebar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 100%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 10px 12px;
            text-decoration: none;
            color: #ffffff;
            font-weight: 600;
            font-size: 0.98rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
            transition: all 0.3s ease;
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateX(-4px);
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.35);
        }

        .btn-google:hover { border-right: 4px solid #4285F4; }
        .btn-youtube:hover { border-right: 4px solid #FF0000; }
        .btn-facebook:hover { border-right: 4px solid #1877F2; }
        .btn-instagram:hover { border-right: 4px solid #E4405F; }
        .btn-twitter:hover { border-right: 4px solid #1DA1F2; }
        .btn-linkedin:hover { border-right: 4px solid #0A66C2; }

        /* ================= SHEET TRACKER STYLES ================= */
        .cst-outer-wrapper {
            font-family: inherit;
            width: 100%;
            background: transparent;
            padding: 0;
            box-shadow: none;
        }

        .cst-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0, 0, 0, 0.25);
            padding: 6px 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cst-time-info {
            font-size: 11px;
            font-weight: 600;
            color: #cbd5e1;
            display: flex;
            gap: 8px;
        }

        .cst-refresh-btn {
            background: #0284c7;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .cst-refresh-btn:hover { background: #0369a1; }

        .cst-notes-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 8px;
            margin-bottom: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cst-note-item, .cst-store-item {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 8px;
            padding: 6px 10px;
            margin-bottom: 6px;
            position: relative;
            color: #ffffff;
        }

        .cst-note-item::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: #0284c7; border-radius: 0 2px 2px 0; }
        .cst-store-item::before { content: ''; position: absolute; left: 0; top: 4px; bottom: 4px; width: 3px; background: #16a34a; border-radius: 0 2px 2px 0; }

        .cst-pl-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            padding-bottom: 4px;
            margin-bottom: 4px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        }

        .cst-pl-data {
            font-size: 12px;
            color: #e2e8f0;
        }
        .cst-pl-label {
            color: #94a3b8;
            font-weight: 600;
            font-size: 11px;
        }
        .cst-pl-value {
            color: #ffffff;
            font-weight: 600;
        }

        .cst-po-summary-bar {
            background: rgba(0, 0, 0, 0.25);
            border-radius: 4px;
            padding: 4px 8px;
            margin-top: 4px;
            display: flex;
            justify-content: space-between;
            font-size: 11px;
        }

        .cst-remark-bar {
            background: rgba(225, 29, 72, 0.15);
            border-radius: 4px;
            padding: 4px 8px;
            margin-top: 4px;
            font-size: 11px;
            color: #fecdd3;
            border: 1px solid rgba(225, 29, 72, 0.3);
            text-align: center;
        }

        .cst-no-data {
            color: #4ade80;
            font-weight: 600;
            font-size: 12px;
            text-align: center;
            padding: 6px 0;
        }

        .cst-status-tab {
            background-color: #475569;
            color: #ffffff;
            padding: 2px 5px;
            border-radius: 4px;
            font-weight: 700;
            font-size: 10px;
            text-transform: uppercase;
        }
        .cst-status-load { background-color: #dc2626; }
        .cst-status-unload { background-color: #2563eb; }
        .cst-status-complete { background-color: #16a34a; }
    </style>
</head>
<body>

    <!-- MAIN RIGHT CONTAINER -->

    <!-- Clock Script -->
    <script>
       function updateClock() {
            const now = new Date();
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedHours = String(hours).padStart(2, '0');
            
            document.getElementById('time').textContent = `${formattedHours}:${minutes} ${ampm}`;

            const day = String(now.getDate()).padStart(2, '0');
            const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
            const month = months[now.getMonth()];
            const year = now.getFullYear();
            
            const days = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
            const dayName = days[now.getDay()];

            document.getElementById('date').innerHTML = `${day}-${month}-${year} (${dayName})`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>

    <!-- Google Sheet DATAE Integration Script -->
    <script>
    const mffdadaEKey = "AIzaSyBe-AlG9lpyXyC7KV-AavR6tbqOc75iYdM";
    const mffdadaEId  = "1ZcLYgP459FzX9eE2-r3yOxdatRyEt-rPeOSvbxRINqU";

    function formatSheetDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return dateStr;

      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const day = d.getDate();
      const month = months[d.getMonth()];
      const year = d.getFullYear();

      let hours = d.getHours();
      const minutes = d.getMinutes().toString().padStart(2, '0');
      const ampm = hours >= 12 ? 'pm' : 'am';

      hours = hours % 12 || 12; 

      return `${day}-${month}-${year}/${hours}:${minutes} ${ampm}`;
    }

    async function loadPendingDATAE(){
      const sheetName = "DATAE";
      const rangedatae = sheetName + "!A:Z";
      const url = `https://sheets.googleapis.com/v4/spreadsheets/${mffdadaEId}/values/${rangedatae}?key=${mffdadaEKey}`;

      try{
        const res = await fetch(url);
        const data = await res.json();
        const rows = data.values || [];

        if(rows.length <= 1) return;

        const body = rows.slice(1);
        const pendingRows = body.filter(row => 
          (row[2] || "").toUpperCase() === "PANDING"
        );

        const ul = document.getElementById("pendingList");
        if(!ul) return;

        ul.innerHTML = "";

        pendingRows.forEach(row => {
          const li = document.createElement("li");
          const formattedDate = formatSheetDate(row[12] || "");
          li.textContent = `${formattedDate} | : ${row[3] || ""} | Party: ${row[4] || ""} | Amount: ${row[5] || ""}`;
          ul.appendChild(li);
        });

      }catch(error){
        console.error("Pending Load Error:", error);
      }
    }

    document.addEventListener("DOMContentLoaded", loadPendingDATAE);
    </script>

    <!-- Notice Board Tracker Live Script -->
    <script>
    const CustomSheetTracker_2026 = {
        sheetKey: "AIzaSyBe-AlG9lpyXyC7KV-AavR6tbqOc75iYdM",
        sheetId: "1gOdnvS_To2tGVuIMtMdNGFT4cCkqyL5gHqBWjnhNG_4",
        rangePL: "PLERP!A:N",
        rangeStore: "STORE!A:X",
        storeRemarksMap: {},
        storeWXDataMap: {}, 

        initUI: function() {
            const mainDiv = document.getElementById('cst-main-container-unique');
            if (mainDiv) {
                mainDiv.innerHTML = `
                    <div class="cst-outer-wrapper">
                        <div class="cst-top-bar">
                            <div class="cst-time-info">
                                <span>📅 <span id="cst-current-date">--/--/----</span></span>
                                <span>⏰ <span id="cst-current-time">--:--:--</span></span>
                            </div>
                            <button class="cst-refresh-btn" onclick="CustomSheetTracker_2026.manualRefresh()">
                                🔄 Refresh
                            </button>
                        </div>

                        <div class="cst-notes-container">
                            <span style="color: #38bdf8; font-size: 13px; font-weight: bold; font-style: italic;">📋 Packing List Status</span>
                            <div id="cst-notesList">Loading...</div>
                        </div>
                        <div class="cst-notes-container">
                            <span style="color: #38bdf8; font-size: 13px; font-weight: bold; font-style: italic;">📋 Store Status</span>
                            <div id="cst-storeList">Loading...</div>
                        </div>
                    </div>
                `;
            }
            this.startClock();
        },

        startClock: function() {
            const updateTime = () => {
                const now = new Date();
                const dateStr = now.toLocaleDateString();
                const timeStr = now.toLocaleTimeString();
                
                const dateEl = document.getElementById('cst-current-date');
                const timeEl = document.getElementById('cst-current-time');
                
                if (dateEl) dateEl.innerText = dateStr;
                if (timeEl) timeEl.innerText = timeStr;
            };
            updateTime();
            setInterval(updateTime, 1000);
        },

        manualRefresh: function() {
            const notesDiv = document.getElementById('cst-notesList');
            const storeDiv = document.getElementById('cst-storeList');
            if (notesDiv) notesDiv.innerHTML = "Refreshing...";
            if (storeDiv) storeDiv.innerHTML = "Refreshing...";
            loadPendingDATAE();
            this.fetchAndRenderAll();
        },

        fetchAndRenderAll: async function() {
            const urlPL = `https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}/values/${this.rangePL}?key=${this.sheetKey}`;
            const urlStore = `https://sheets.googleapis.com/v4/spreadsheets/${this.sheetId}/values/${this.rangeStore}?key=${this.sheetKey}`;

            try {
                const storeResponse = await fetch(urlStore);
                const storeData = await storeResponse.json();
                
                if (storeData.values && storeData.values.length > 0) {
                    if (storeData.values[0] && storeData.values[0][12]) {
                        const bgUrl = storeData.values[0][12].trim();
                        if (bgUrl && bgUrl.startsWith("http")) {
                            document.body.style.backgroundImage = `url('${bgUrl}')`;
                            document.body.style.backgroundSize = "cover";
                            document.body.style.backgroundPosition = "center";
                            document.body.style.backgroundRepeat = "no-repeat";
                            document.body.style.backgroundAttachment = "fixed";
                        }
                    }

                    this.storeRemarksMap = {};
                    this.storeWXDataMap = {}; 
                    
                    storeData.values.forEach(row => {
                        const colO = row[14] ? row[14].trim() : "";
                        const colP = row[15] ? row[15].trim() : "";
                        if (colO !== "") {
                            this.storeRemarksMap[colO] = colP;
                        }

                        const colR = row[17] ? row[17].trim() : "";
                        const colW = row[22] ? row[22].trim() : "0";
                        const colX = row[23] ? row[23].trim() : "0";

                        if (colR !== "") {
                            const last3Digits = colR.slice(-3);
                            if (last3Digits) {
                                this.storeWXDataMap[last3Digits] = { w: colW, x: colX };
                            }
                        }
                    });
                    this.renderStoreNotes(storeData.values);
                } else {
                    document.getElementById('cst-storeList').innerHTML = "<p class='cst-no-data'>No data found in Store sheet.</p>";
                }
            } catch (error) {
                console.error("Error fetching store data:", error);
                document.getElementById('cst-storeList').innerHTML = "<p style='color:#f87171; font-size:12px;'>Store data load error.</p>";
            }

            try {
                const response = await fetch(urlPL);
                const data = await response.json();
                
                if (data.values && data.values.length > 0) {
                    this.renderPLNotes(data.values);
                } else {
                    document.getElementById('cst-notesList').innerHTML = "<p class='cst-no-data'>No data found in the sheet.</p>";
                }
            } catch (error) {
                console.error("Error fetching PL data:", error);
                document.getElementById('cst-notesList').innerHTML = "<p style='color:#f87171; font-size:12px;'>Data load error.</p>";
            }
        },

        renderPLNotes: function(rows) {
            const notesListDiv = document.getElementById('cst-notesList');
            notesListDiv.innerHTML = ""; 
            let hasPendingItems = false;

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                const colA = row[0] ? row[0].trim() : "";
                const colB = row[1] ? row[1].trim() : "";
                const colC = row[2] ? row[2].trim() : ""; 
                const colD = row[3] ? row[3].trim() : "";
                const colE = row[4] ? row[4].trim() : "";
                const colG = row[6] ? row[6].trim() : "";
                const colN = row[13] ? row[13].trim() : "";

                if (colA !== "" && colD === "") {
                    hasPendingItems = true;
                    const matchedRemark = this.storeRemarksMap[colC] || "No Remark";

                    const colCLast3 = colC.slice(-3);
                    const matchedWX = this.storeWXDataMap[colCLast3] || { w: "0", x: "0" };
                    
                    const valW = parseFloat(matchedWX.w) || 0;
                    const valX = parseFloat(matchedWX.x) || 0;

                    const colorW = valW < 0 ? "#f87171" : "#2dd4bf";
                    const colorX = valX < 0 ? "#f87171" : "#2dd4bf";

                    const noteHTML = `
                        <div class="cst-note-item">
                            <div class="cst-pl-row">
                                <div style="display:flex; align-items:center; gap:4px;">
                                    <span class="cst-status-tab">${colN || 'N/A'}</span>
                                    <span class="cst-pl-data">👤 <span class="cst-pl-value">${colG || 'N/A'}</span></span>
                                </div>
                            </div>

                            <div style="display: flex; justify-content: space-between; gap: 4px; flex-wrap: wrap;">
                                <div class="cst-pl-data"><span class="cst-pl-label">🔢 No:</span> <span class="cst-pl-value">${colA}</span></div>
                                <div class="cst-pl-data"><span class="cst-pl-label">📅 Date:</span> <span class="cst-pl-value">${colB || 'N/A'}</span></div>
                                <div class="cst-pl-data"><span class="cst-pl-label">🧾 Job:</span> <strong style="color: #fb923c;">${colC || 'N/A'}</strong></div>
                                <div class="cst-pl-data"><span class="cst-pl-label">🚚</span> <span class="cst-pl-value" style="color:#60a5fa;">${colE || 'N/A'}</span></div>
                            </div>

                            <div class="cst-remark-bar">
                                <span>📝 ${matchedRemark}</span> 
                            </div> 

                            <div class="cst-po-summary-bar">
                                <span style="color: #38bdf8; font-weight: 700;">PO Summary</span> 
                                <span style="color: ${colorW}; font-weight: 700;">💵 B-Amt: ${matchedWX.w}</span>
                                <span style="color: ${colorX}; font-weight: 700;">⚖️ B-Wgt: ${matchedWX.x}</span>
                            </div> 
                        </div>
                    `;
                    notesListDiv.innerHTML += noteHTML;
                }
            }

            if (!hasPendingItems) {
                notesListDiv.innerHTML = "<p class='cst-no-data'>Relax, no loading status Found.</p>";
            }
        },

        renderStoreNotes: function(rows) {
            const storeListDiv = document.getElementById('cst-storeList');
            storeListDiv.innerHTML = ""; 
            let hasStoreItems = false;

            for (let i = 1; i < rows.length; i++) {
                const row = rows[i];
                const colC = row[2] ? row[2].trim().toLowerCase() : ""; 
                const colC_original = row[2] ? row[2].trim() : ""; 
                const colD = row[3] ? row[3].trim() : "N/A";
                const colE = row[4] ? row[4].trim() : "N/A";
                const colH = row[7] ? row[7].trim() : "N/A";
                const colK = row[10] ? row[10].trim() : "N/A";

                if (colC === "load" || colC === "unload" || colC === "complete") {
                    hasStoreItems = true;

                    let statusClass = "";
                    if (colC === "load") statusClass = "cst-status-load";
                    else if (colC === "unload") statusClass = "cst-status-unload";
                    else if (colC === "complete") statusClass = "cst-status-complete";

                    const storeHTML = `
                        <div class="cst-store-item">
                            <div class="cst-pl-row">
                                <div style="display:flex; align-items:center; gap:4px;">
                                    <span class="cst-status-tab ${statusClass}">${colC_original}</span>
                                    <span class="cst-pl-data">👤 <span class="cst-pl-value">${colE}</span></span>
                                </div>
                            </div>
                            <div style="display: flex; justify-content: space-between;">
                                <div class="cst-pl-data"><span class="cst-pl-label">📅 Date:</span> <span class="cst-pl-value">${colD}</span></div>
                                <div class="cst-pl-data"><span class="cst-pl-label">🚚 Veh:</span> <span class="cst-pl-value" style="color:#60a5fa;">${colK}</span></div>

      function timeToDate(t){
        let [h,m] = t.split(":");
        let d = new Date();
        d.setHours(h,m,0,0);
        return d;
      }

      function getNextPrayer(){
        const now = new Date();
        const order = ["Fajr","Dhuhr","Asr","Maghrib","Isha"];

        for(let p of order){
          let t = timeToDate(prayerTimes[p]);
          if(now < t){

          }
        }

        let fajr = timeToDate(prayerTimes["Fajr"]);
        fajr.setDate(fajr.getDate() + 1);

        return {name:"Fajr", time:fajr};
      }

      function formatCountdown(diff){
        let h = Math.floor(diff/3600000);
        let m = Math.floor((diff%3600000)/60000);
        let s = Math.floor((diff%60000)/1000);
        return `${h}h ${m}m ${s}s`;
      }

      function startCountdown(){
        setInterval(()=>{
          if(!nextTime) return;
          const now = new Date();
          let diff = nextTime - now;

          if(diff <= 0 && !alerted){
            alerted = true;
            alert("🕌 " + nextPrayer + " ka time ho gaya");
            const np = getNextPrayer();
            nextPrayer = np.name;
            nextTime = np.time;
            document.getElementById("nextPrayer").innerText = nextPrayer;
            setTimeout(()=> alerted = false, 60000);
            return;
          }

          const cdElem = document.getElementById("countdown");
          if(cdElem) cdElem.innerText = formatCountdown(diff);

        },1000);
      }
